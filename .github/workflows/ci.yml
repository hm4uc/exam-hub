name: CI

# Chỉ báo xanh/đỏ; Vercel tự deploy khi push lên main, không chờ CI.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          if ! npm ci > npm-ci.log 2>&1; then
            # Đưa lỗi lên phần chú thích của lần chạy để đọc nhanh.
            echo "::error title=npm ci failed::$(tail -25 npm-ci.log | tr '\n' '|')"
            cat npm-ci.log; exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Build không gọi Supabase; giá trị giả chỉ để thoả biến môi trường.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: 1
